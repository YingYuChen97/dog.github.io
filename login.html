<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 - PawWalk</title>
<link rel="stylesheet" href="css/auth.css">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft JhengHei",sans-serif;
}
body{ background:#f8f9fa; }
header{
    background:#ff914d;
    color:white;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
header h1{ font-size:30px; }
header h1 a{ color:white; text-decoration:none; }
nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-weight:bold;
}
footer{
    background:#333;
    color:white;
    text-align:center;
    padding:30px;
}
@media (max-width:640px){
    header{ flex-direction:column; gap:12px; text-align:center; }
    nav a{ margin:0 10px; }
}
</style>
</head>
<body>

<header>
    <h1><a href="index.html">🐶 PawWalk</a></h1>
    <nav id="main-nav">
        <a href="index.html">首頁</a>
        <a href="dogs.html">可愛狗狗</a>
        <a href="community.html">狗社群</a>
        <span data-auth-slot></span>
    </nav>
</header>

<main class="auth-page">
    <div class="auth-card">
        <h2>登入</h2>
        <p class="subtitle">回到 PawWalk，繼續媒合遛狗行程</p>

        <div class="auth-error" id="auth-error"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button class="auth-submit" type="submit" id="submit-btn">登入</button>
        </form>

        <p class="auth-footer">
            還沒有帳號？ <a href="register.html">立即註冊</a>
        </p>
    </div>
</main>

<footer>
    <p>© 2026 PawWalk 遛狗媒合平台</p>
</footer>

<script src="js/auth.js"></script>
<script src="js/nav-auth.js"></script>
<script>
(function () {
    if (Auth.isLoggedIn()) {
        window.location.href = "index.html";
        return;
    }

    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("auth-error");
    const btn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.classList.remove("show");
        btn.disabled = true;

        const result = await Auth.login({
            email: form.email.value,
            password: form.password.value
        });

        btn.disabled = false;

        if (!result.ok) {
            errorEl.textContent = result.error;
            errorEl.classList.add("show");
            return;
        }

        window.location.href = "index.html";
    });
})();
</script>
</body>
</html>
