<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawWalk - 遛狗媒合平台</title>
<link rel="stylesheet" href="css/auth.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft JhengHei",sans-serif;
}

body{
    background:#f8f9fa;
}

header{
    background:#ff914d;
    color:white;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:30px;
}

header h1 a{
    color:white;
    text-decoration:none;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-weight:bold;
}

.hero{
    height:500px;
    background-image:url("https://source.unsplash.com/1600x900/?dog,park");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
}

.hero-text{
    background:rgba(255,255,255,.8);
    padding:40px;
    border-radius:20px;
    text-align:center;
}

.hero-text h2{
    font-size:40px;
    color:#ff7b00;
    margin-bottom:15px;
}

.hero-text p{
    font-size:20px;
    margin-bottom:25px;
}

.btn{
    background:#ff914d;
    color:white;
    padding:15px 30px;
    border-radius:30px;
    text-decoration:none;
    font-size:18px;
}

.btn-outline{
    background:white;
    color:#ff914d;
    border:2px solid #ff914d;
    padding:10px 22px;
    border-radius:30px;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
    display:inline-block;
    transition:.2s;
}

.btn-outline:hover{
    background:#ff914d;
    color:white;
}

.section{
    width:90%;
    max-width:1200px;
    margin:60px auto;
}

.section-head{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:16px;
    margin-bottom:35px;
}

.section-head h2{
    margin:0;
    color:#444;
    text-align:center;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:30px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    transition:.3s;
}

.card-link{
    display:block;
    color:inherit;
    text-decoration:none;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card-content h3{
    color:#ff914d;
    margin-bottom:10px;
}

.card-content p{
    color:#555;
    line-height:1.6;
}

.feature{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    text-align:center;
}

.box{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.box h3{
    color:#ff914d;
    margin:15px 0;
}

footer{
    margin-top:60px;
    background:#333;
    color:white;
    text-align:center;
    padding:30px;
}

@media (max-width:640px){
    header{
        flex-direction:column;
        gap:12px;
        text-align:center;
    }
    nav a{
        margin:0 10px;
    }
}
</style>

</head>
<body>

<header>
    <h1><a href="index.html">🐶 PawWalk</a></h1>

    <nav id="main-nav">
        <a href="index.html">首頁</a>
        <a href="dogs.html">可愛狗狗</a>
        <a href="community.html">狗社群</a>
        <span data-auth-slot></span>
    </nav>
</header>

<section class="hero">

<div class="hero-text">
    <h2>找到最適合的遛狗夥伴</h2>
    <p>主人安心上班，狗狗快樂散步。</p>
    <a class="btn" href="register.html">立即開始</a>
</div>

</section>

<section class="section">

<div class="section-head">
    <h2>今日可愛狗狗</h2>
    <a class="btn-outline" href="dogs.html">顯示更多</a>
</div>

<div class="cards" id="featured-dogs"></div>

</section>

<section class="section">

<h2>平台特色</h2>

<div class="feature">

<div class="box">
<h3>👨‍💼 忙碌主人</h3>
<p>
快速找到值得信任的遛狗員。
</p>
</div>

<div class="box">
<h3>🐾 熱愛狗狗的人</h3>
<p>
利用空閒時間陪伴毛孩，也能賺取收入。
</p>
</div>

<div class="box">
<h3>⭐ 評價制度</h3>
<p>
行程完成後雙方互評，累積可信分數。
</p>
</div>

<div class="box">
<h3>📸 狗社群</h3>
<p>
分享毛孩照片，大家一起按讚留言。
</p>
<p style="margin-top:14px;">
<a class="btn-outline" href="community.html" style="font-size:14px;padding:8px 16px;">逛社群</a>
</p>
</div>

</div>

</section>

<footer>

<p>
© 2026 PawWalk 遛狗媒合平台
</p>

</footer>

<script src="js/listings.js"></script>
<script src="data/dogs.js"></script>
<script src="js/dogs-ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav-auth.js"></script>
<script>
DogsUI.render(
    document.getElementById("featured-dogs"),
    DogData.featured(3),
    "simple"
);
</script>
</body>
</html>
