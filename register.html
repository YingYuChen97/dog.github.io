<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>註冊 - PawWalk</title>
<link rel="stylesheet" href="css/auth.css">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft JhengHei",sans-serif;
}
body{ background:#f8f9fa; }
header{
    background:#ff914d;
    color:white;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
header h1{ font-size:30px; }
header h1 a{ color:white; text-decoration:none; }
nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-weight:bold;
}
footer{
    background:#333;
    color:white;
    text-align:center;
    padding:30px;
}
@media (max-width:640px){
    header{ flex-direction:column; gap:12px; text-align:center; }
    nav a{ margin:0 10px; }
}
</style>
</head>
<body>

<header>
    <h1><a href="index.html">🐶 PawWalk</a></h1>
    <nav id="main-nav">
        <a href="index.html">首頁</a>
        <a href="dogs.html">可愛狗狗</a>
        <a href="community.html">狗社群</a>
        <span data-auth-slot></span>
    </nav>
</header>

<main class="auth-page">
    <div class="auth-card">
        <h2>註冊帳號</h2>
        <p class="subtitle">加入 PawWalk，當主人或成為遛狗員</p>

        <div class="auth-error" id="auth-error"></div>

        <form id="register-form">
            <div class="form-group">
                <label for="name">名稱</label>
                <input type="text" id="name" name="name" autocomplete="name" required maxlength="40">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">密碼（至少 6 碼）</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="password2">確認密碼</label>
                <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="6">
            </div>
            <div class="form-group">
                <label>我是…</label>
                <div class="role-options">
                    <label>
                        <input type="radio" name="role" value="owner" checked>
                        狗狗主人
                    </label>
                    <label>
                        <input type="radio" name="role" value="walker">
                        遛狗員
                    </label>
                </div>
            </div>
            <button class="auth-submit" type="submit" id="submit-btn">建立帳號</button>
        </form>

        <p class="auth-footer">
            已經有帳號？ <a href="login.html">前往登入</a>
        </p>
    </div>
</main>

<footer>
    <p>© 2026 PawWalk 遛狗媒合平台</p>
</footer>

<script src="js/auth.js"></script>
<script src="js/nav-auth.js"></script>
<script>
(function () {
    if (Auth.isLoggedIn()) {
        window.location.href = "index.html";
        return;
    }

    const form = document.getElementById("register-form");
    const errorEl = document.getElementById("auth-error");
    const btn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.classList.remove("show");

        if (form.password.value !== form.password2.value) {
            errorEl.textContent = "兩次輸入的密碼不一致。";
            errorEl.classList.add("show");
            return;
        }

        btn.disabled = true;

        const result = await Auth.register({
            name: form.name.value,
            email: form.email.value,
            password: form.password.value,
            role: form.role.value
        });

        btn.disabled = false;

        if (!result.ok) {
            errorEl.textContent = result.error;
            errorEl.classList.add("show");
            return;
        }

        window.location.href = "index.html";
    });
})();
</script>
</body>
</html>
